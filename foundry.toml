[profile.default]
src = "src"
out = "out"
libs = ["lib"]
use_literal_content = true
bytecode_hash = "none"
via_ir = true
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]

[profile.deploy]
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./" }]

# forge >=1.8 lint-on-build hangs on this repo (CI runners killed mid-build). Run `forge lint` explicitly.
[lint]
lint_on_build = false

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad = "${MONAD_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
