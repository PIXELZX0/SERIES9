<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <path id="rim" d="M 128,26 a 102,102 0 1,1 -0.01,0" fill="none"/>
  </defs>

  <!-- coin base -->
  <circle cx="128" cy="128" r="128" fill="#0a0a0a"/>
  <circle cx="128" cy="128" r="121" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.9"/>
  <circle cx="128" cy="128" r="92" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.28"/>

  <!-- rim text: SERIES9 repeating, slow rotation -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
                      from="0 128 128" to="360 128 128"
                      dur="40s" repeatCount="indefinite"/>
    <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
          font-size="13" font-weight="500" letter-spacing="2"
          fill="#ffffff" opacity="0.55">
      <!-- 6 identical "SERIES9 · " units incl. trailing nbsp, so the wrap gap
           matches the others; textLength = 2*pi*102 (full rim circumference) -->
      <textPath href="#rim" startOffset="0" textLength="640.9" lengthAdjust="spacing">SERIES9&#160;&#183;&#160;SERIES9&#160;&#183;&#160;SERIES9&#160;&#183;&#160;SERIES9&#160;&#183;&#160;SERIES9&#160;&#183;&#160;SERIES9&#160;&#183;&#160;</textPath>
    </text>
  </g>

  <!-- concave 4-pointed star (center 128,106 / R 56 / inner 14) -->
  <path fill="#ffffff" d="M 128,50
    Q 137.9,96.1 184,106
    Q 137.9,115.9 128,162
    Q 118.1,115.9 72,106
    Q 118.1,96.1 128,50 Z"/>
  <!-- knocked-out inner star (same shape at 0.55) -->
  <path fill="#0a0a0a" d="M 128,75.2
    Q 133.45,100.55 158.8,106
    Q 133.45,111.45 128,136.8
    Q 122.55,111.45 97.2,106
    Q 122.55,100.55 128,75.2 Z"/>

  <!-- SER9 wordmark -->
  <text x="128" y="186" text-anchor="middle" dominant-baseline="central"
        font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="15" font-weight="600" letter-spacing="3.5"
        fill="#ffffff">SER9</text>
</svg>
