name: Release Monad Mainnet Upgrade

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-generate-safe-tx:
    name: Deploy Upgrade + Safe Tx JSON
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      STAKING_PROXY: ${{ secrets.STAKING_PROXY }}
      IDENTITY_PROXY: ${{ secrets.IDENTITY_PROXY }}
      STAKING_UPGRADE_DATA: ${{ secrets.STAKING_UPGRADE_DATA }}
      SER9_UPGRADE_DATA: ${{ secrets.SER9_UPGRADE_DATA }}
      IDENTITY_UPGRADE_DATA: ${{ secrets.IDENTITY_UPGRADE_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${MONAD_RPC_URL:?GitHub secret MONAD_RPC_URL is required}"
          : "${PRIVATE_KEY:?GitHub secret PRIVATE_KEY is required}"
          : "${STAKING_PROXY:?GitHub secret STAKING_PROXY is required}"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        env:
          FOUNDRY_PROFILE: deploy
        run: forge build

      - name: Generate ABI JSON files
        id: abi
        shell: bash
        run: |
          set -euo pipefail

          REF_SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          REF_SLUG="${REF_SLUG##-}"
          REF_SLUG="${REF_SLUG%%-}"
          if [[ -z "$REF_SLUG" ]]; then
            REF_SLUG="run-${GITHUB_RUN_ID}"
          fi

          ABI_DIR="release-abis-${REF_SLUG}"
          mkdir -p "$ABI_DIR"

          jq '.abi' out/Series9Staking.sol/Series9Staking.json > "$ABI_DIR/Series9Staking.abi.json"
          jq '.abi' out/SER9Token.sol/SER9Token.json > "$ABI_DIR/SER9Token.abi.json"
          jq '.abi' out/Series9ManagedToken.sol/Series9ManagedToken.json > "$ABI_DIR/Series9ManagedToken.abi.json"
          jq '.abi' out/Series9Identity.sol/Series9Identity.json > "$ABI_DIR/Series9Identity.abi.json"

          echo "abi_dir=$ABI_DIR" >> "$GITHUB_OUTPUT"
          echo "ref_slug=$REF_SLUG" >> "$GITHUB_OUTPUT"

      - name: Detect contracts requiring upgrade
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          # EIP-1967 implementation slot
          IMPL_SLOT=0x360894a13ba1a3210667c828492db98dca3e2076cc3735a920a3ca505d382bbc

          normalize_bytecode() {
            local raw="$1"
            printf '%s' "${raw#0x}" | tr 'A-F' 'a-f'
          }

          read_impl_address() {
            local proxy="$1"
            local raw
            raw="$(cast storage "$proxy" "$IMPL_SLOT" --rpc-url "$MONAD_RPC_URL")"
            # bytes32 -> address: take last 20 bytes (40 hex chars), drop "0x" + 24 leading-zero hex chars
            printf '0x%s' "${raw:26}"
          }

          bytecode_matches() {
            local impl="$1"
            local artifact="$2"
            local onchain local_bc
            onchain="$(cast code "$impl" --rpc-url "$MONAD_RPC_URL")"
            local_bc="$(jq -r '.deployedBytecode.object' "$artifact")"
            [[ "$(normalize_bytecode "$onchain")" == "$(normalize_bytecode "$local_bc")" ]]
          }

          decide_deploy() {
            local impl="$1"
            local artifact="$2"
            if [[ -z "$impl" || "$impl" == "0x" || "$impl" == "0x0000000000000000000000000000000000000000" ]]; then
              echo true
              return
            fi
            if bytecode_matches "$impl" "$artifact"; then
              echo false
            else
              echo true
            fi
          }

          STAKING_CURRENT_IMPL="$(read_impl_address "$STAKING_PROXY")"
          DEPLOY_STAKING="$(decide_deploy "$STAKING_CURRENT_IMPL" out/Series9Staking.sol/Series9Staking.json)"

          SER9_PROXY="$(cast call "$STAKING_PROXY" "ser9()(address)" --rpc-url "$MONAD_RPC_URL")"
          SER9_CURRENT_IMPL="$(read_impl_address "$SER9_PROXY")"
          DEPLOY_SER9="$(decide_deploy "$SER9_CURRENT_IMPL" out/SER9Token.sol/SER9Token.json)"

          MANAGED_CURRENT_IMPL="$(cast call "$STAKING_PROXY" "managedTokenImplementation()(address)" --rpc-url "$MONAD_RPC_URL")"
          DEPLOY_MANAGED="$(decide_deploy "$MANAGED_CURRENT_IMPL" out/Series9ManagedToken.sol/Series9ManagedToken.json)"

          DEPLOY_IDENTITY=false
          IDENTITY_CURRENT_IMPL=""
          if [[ -n "${IDENTITY_PROXY:-}" ]]; then
            IDENTITY_CURRENT_IMPL="$(read_impl_address "$IDENTITY_PROXY")"
            DEPLOY_IDENTITY="$(decide_deploy "$IDENTITY_CURRENT_IMPL" out/Series9Identity.sol/Series9Identity.json)"
          fi

          {
            echo "deploy_staking=$DEPLOY_STAKING"
            echo "deploy_ser9=$DEPLOY_SER9"
            echo "deploy_managed=$DEPLOY_MANAGED"
            echo "deploy_identity=$DEPLOY_IDENTITY"
            echo "staking_current_impl=$STAKING_CURRENT_IMPL"
            echo "ser9_proxy=$SER9_PROXY"
            echo "ser9_current_impl=$SER9_CURRENT_IMPL"
            echo "managed_current_impl=$MANAGED_CURRENT_IMPL"
            echo "identity_current_impl=$IDENTITY_CURRENT_IMPL"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Contract change detection"
            echo "- Staking: deploy=\`$DEPLOY_STAKING\` (current=\`$STAKING_CURRENT_IMPL\`)"
            echo "- SER9: deploy=\`$DEPLOY_SER9\` (current=\`$SER9_CURRENT_IMPL\`)"
            echo "- ManagedToken: deploy=\`$DEPLOY_MANAGED\` (current=\`$MANAGED_CURRENT_IMPL\`)"
            if [[ -n "${IDENTITY_PROXY:-}" ]]; then
              echo "- Identity: deploy=\`$DEPLOY_IDENTITY\` (current=\`$IDENTITY_CURRENT_IMPL\`)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy implementations and generate Safe Transaction Builder JSON
        id: deploy
        env:
          FOUNDRY_PROFILE: deploy
          SKIP_VERIFY_INPUT: ${{ vars.SKIP_VERIFY }}
          SOCIALSCAN_VERIFIER_URL: https://api.socialscan.io/monad/v1/explorer/command_api/contract
          DEPLOY_STAKING: ${{ steps.detect.outputs.deploy_staking }}
          DEPLOY_SER9: ${{ steps.detect.outputs.deploy_ser9 }}
          DEPLOY_MANAGED: ${{ steps.detect.outputs.deploy_managed }}
          DEPLOY_IDENTITY: ${{ steps.detect.outputs.deploy_identity }}
        run: |
          set -euo pipefail

          # Verify on SocialScan by default.
          # Set repository variable SKIP_VERIFY=true only when you explicitly want to skip verification.
          if [[ -n "${SKIP_VERIFY_INPUT:-}" ]]; then
            case "${SKIP_VERIFY_INPUT,,}" in
              true|false)
                export SKIP_VERIFY="${SKIP_VERIFY_INPUT,,}"
                ;;
              *)
                echo "Invalid SKIP_VERIFY value: ${SKIP_VERIFY_INPUT}. Use true or false." >&2
                exit 1
                ;;
            esac
          else
            export SKIP_VERIFY="false"
          fi

          STAKING_DATA="${STAKING_UPGRADE_DATA:-}"
          SER9_DATA="${SER9_UPGRADE_DATA:-}"
          IDENTITY_DATA="${IDENTITY_UPGRADE_DATA:-}"
          if [[ -z "$SER9_DATA" ]]; then SER9_DATA="0x"; fi
          if [[ -z "$STAKING_DATA" ]]; then STAKING_DATA="0x"; fi
          if [[ -z "$IDENTITY_DATA" ]]; then IDENTITY_DATA="0x"; fi

          REF_SLUG="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._-' '-')"
          REF_SLUG="${REF_SLUG##-}"
          REF_SLUG="${REF_SLUG%%-}"
          if [[ -z "$REF_SLUG" ]]; then
            REF_SLUG="run-${GITHUB_RUN_ID}"
          fi

          STAKING_IMPL=""
          STAKING_TX_HASH=""
          SER9_IMPL=""
          SER9_TX_HASH=""
          MANAGED_IMPL=""
          MANAGED_TX_HASH=""
          IDENTITY_IMPL=""
          IDENTITY_TX_HASH=""

          parse_deploy_address() {
            local label="$1"
            local json="$2"
            local addr
            addr="$(echo "$json" | jq -r '.deployedTo')"
            if [[ -z "$addr" || "$addr" == "null" ]]; then
              echo "Failed to parse deployed $label implementation address" >&2
              exit 1
            fi
            echo "$addr"
          }

          if [[ "$DEPLOY_STAKING" == "true" ]]; then
            echo "Deploying Staking implementation..."
            STAKING_DEPLOY_JSON="$(forge create src/Series9Staking.sol:Series9Staking \
              --rpc-url "$MONAD_RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              --broadcast \
              --json)"
            STAKING_IMPL="$(parse_deploy_address Staking "$STAKING_DEPLOY_JSON")"
            STAKING_TX_HASH="$(echo "$STAKING_DEPLOY_JSON" | jq -r '.transactionHash')"
          else
            echo "Staking implementation matches on-chain bytecode; skipping deploy."
          fi

          if [[ "$DEPLOY_SER9" == "true" ]]; then
            echo "Deploying SER9 implementation..."
            SER9_DEPLOY_JSON="$(forge create src/SER9Token.sol:SER9Token \
              --rpc-url "$MONAD_RPC_URL" \
              --private-key "$PRIVATE_KEY" \
              --broadcast \
              --json)"
            SER9_IMPL="$(parse_deploy_address SER9 "$SER9_DEPLOY_JSON")"
            SER9_TX_HASH="$(echo "$SER9_DEPLOY_JSON" | jq -r '.transactionHash')"
          else
            echo "SER9 implementation matches on-chain bytecode; skipping deploy."
          fi

          if [[ "$DEPLOY_MANAGED" == "true" ]]; then
            echo "Deploying ManagedToken implementation..."
            MANAGED_DEPLOY_JSON="$(forge create src/Series9ManagedToken.sol:Series9ManagedToken \
              --rpc-url "$MONAD_RPC_URL" \
              --broadcast \
              --private-key "$PRIVATE_KEY" \
              --json)"
            MANAGED_IMPL="$(parse_deploy_address ManagedToken "$MANAGED_DEPLOY_JSON")"
            MANAGED_TX_HASH="$(echo "$MANAGED_DEPLOY_JSON" | jq -r '.transactionHash')"
          else
            echo "ManagedToken implementation matches on-chain bytecode; skipping deploy."
          fi

          if [[ -n "${IDENTITY_PROXY:-}" && "$DEPLOY_IDENTITY" == "true" ]]; then
            echo "Deploying Identity implementation..."
            IDENTITY_DEPLOY_JSON="$(forge create src/Series9Identity.sol:Series9Identity \
              --rpc-url "$MONAD_RPC_URL" \
              --broadcast \
              --private-key "$PRIVATE_KEY" \
              --json)"
            IDENTITY_IMPL="$(parse_deploy_address Identity "$IDENTITY_DEPLOY_JSON")"
            IDENTITY_TX_HASH="$(echo "$IDENTITY_DEPLOY_JSON" | jq -r '.transactionHash')"
          elif [[ -z "${IDENTITY_PROXY:-}" ]]; then
            echo "IDENTITY_PROXY is not set; skipping Identity implementation deployment and upgrade transaction."
          else
            echo "Identity implementation matches on-chain bytecode; skipping deploy."
          fi

          VERIFICATION_STATUS="skipped"
          VERIFICATION_FAILURES=""

          verify_contract() {
            local contract_address="$1"
            local contract_name="$2"
            local contract_label="$3"

            if forge verify-contract "$contract_address" "$contract_name" \
              --chain 143 \
              --rpc-url "$MONAD_RPC_URL" \
              --verifier blockscout \
              --verifier-url "$SOCIALSCAN_VERIFIER_URL"; then
              echo "Verification succeeded for ${contract_label}."
            else
              echo "::warning title=Contract verification failed::${contract_label} verification failed; continuing to generate Safe Transaction Builder JSON."
              if [[ -n "$VERIFICATION_FAILURES" ]]; then
                VERIFICATION_FAILURES="${VERIFICATION_FAILURES},${contract_label}"
              else
                VERIFICATION_FAILURES="$contract_label"
              fi
            fi
          }

          if [[ "$SKIP_VERIFY" == "false" ]]; then
            VERIFIED_ANY=false
            if [[ -n "$STAKING_IMPL" ]]; then
              echo "Verifying Staking on SocialScan via Blockscout..."
              VERIFIED_ANY=true
              verify_contract "$STAKING_IMPL" src/Series9Staking.sol:Series9Staking "Series9Staking"
            fi
            if [[ -n "$SER9_IMPL" ]]; then
              echo "Verifying SER9 on SocialScan via Blockscout..."
              VERIFIED_ANY=true
              verify_contract "$SER9_IMPL" src/SER9Token.sol:SER9Token "SER9Token"
            fi
            if [[ -n "$MANAGED_IMPL" ]]; then
              echo "Verifying ManagedToken on SocialScan via Blockscout..."
              VERIFIED_ANY=true
              verify_contract "$MANAGED_IMPL" src/Series9ManagedToken.sol:Series9ManagedToken "Series9ManagedToken"
            fi
            if [[ -n "$IDENTITY_IMPL" ]]; then
              echo "Verifying Identity on SocialScan via Blockscout..."
              VERIFIED_ANY=true
              verify_contract "$IDENTITY_IMPL" src/Series9Identity.sol:Series9Identity "Series9Identity"
            fi

            if [[ "$VERIFIED_ANY" == "true" ]]; then
              if [[ -n "$VERIFICATION_FAILURES" ]]; then
                VERIFICATION_STATUS="partial_failure"
              else
                VERIFICATION_STATUS="success"
              fi
            else
              VERIFICATION_STATUS="not_required"
            fi
          else
            echo "Skipping verification (SKIP_VERIFY=true)."
          fi

          TX_ARRAY="[]"
          DESCRIPTION_PARTS=""

          append_description() {
            if [[ -n "$DESCRIPTION_PARTS" ]]; then
              DESCRIPTION_PARTS="${DESCRIPTION_PARTS}, $1"
            else
              DESCRIPTION_PARTS="$1"
            fi
          }

          if [[ -n "$STAKING_IMPL" ]]; then
            STAKING_UPGRADE_CALLDATA="$(cast calldata \
              "upgradeToAndCall(address,bytes)" \
              "$STAKING_IMPL" \
              "$STAKING_DATA")"
            TX_ARRAY="$(echo "$TX_ARRAY" | jq \
              --arg to "$STAKING_PROXY" \
              --arg data "$STAKING_UPGRADE_CALLDATA" \
              '. + [{"to": $to, "value": "0", "data": $data}]')"
            append_description "Staking"
          fi

          if [[ -n "$SER9_IMPL" ]]; then
            UPGRADE_SER9_CALLDATA="$(cast calldata \
              "upgradeSer9(address,bytes)" \
              "$SER9_IMPL" \
              "$SER9_DATA")"
            TX_ARRAY="$(echo "$TX_ARRAY" | jq \
              --arg to "$STAKING_PROXY" \
              --arg data "$UPGRADE_SER9_CALLDATA" \
              '. + [{"to": $to, "value": "0", "data": $data}]')"
            append_description "SER9"
          fi

          if [[ -n "$MANAGED_IMPL" ]]; then
            SET_MANAGED_IMPL_CALLDATA="$(cast calldata \
              "setManagedTokenImplementation(address)" \
              "$MANAGED_IMPL")"
            TX_ARRAY="$(echo "$TX_ARRAY" | jq \
              --arg to "$STAKING_PROXY" \
              --arg data "$SET_MANAGED_IMPL_CALLDATA" \
              '. + [{"to": $to, "value": "0", "data": $data}]')"
            append_description "ManagedToken"
          fi

          if [[ -n "$IDENTITY_IMPL" ]]; then
            IDENTITY_UPGRADE_CALLDATA="$(cast calldata \
              "upgradeToAndCall(address,bytes)" \
              "$IDENTITY_IMPL" \
              "$IDENTITY_DATA")"
            TX_ARRAY="$(echo "$TX_ARRAY" | jq \
              --arg to "$IDENTITY_PROXY" \
              --arg data "$IDENTITY_UPGRADE_CALLDATA" \
              '. + [{"to": $to, "value": "0", "data": $data}]')"
            append_description "Identity"
          fi

          TX_COUNT="$(echo "$TX_ARRAY" | jq 'length')"
          DESCRIPTION="No contract changes detected."
          if [[ "$TX_COUNT" != "0" ]]; then
            DESCRIPTION="Upgrade ${DESCRIPTION_PARTS}."
          fi

          SAFE_JSON_OUT="safe-tx-upgrade-${REF_SLUG}.json"
          jq -n \
            --arg chainId "143" \
            --arg description "$DESCRIPTION" \
            --argjson transactions "$TX_ARRAY" \
            '{
              "version": "1.0",
              "chainId": $chainId,
              "meta": {
                "name": "Series9 Upgrade",
                "description": $description
              },
              "transactions": $transactions
            }' > "$SAFE_JSON_OUT"

          jq -e --argjson expected "$TX_COUNT" '.transactions | length == $expected' "$SAFE_JSON_OUT" >/dev/null

          RUN_FILE="release-deploy-${REF_SLUG}.json"
          jq -n \
            --arg chainId "143" \
            --arg stakingProxy "$STAKING_PROXY" \
            --arg identityProxy "${IDENTITY_PROXY:-}" \
            --arg stakingImpl "$STAKING_IMPL" \
            --arg ser9Impl "$SER9_IMPL" \
            --arg managedImpl "$MANAGED_IMPL" \
            --arg identityImpl "$IDENTITY_IMPL" \
            --arg stakingTxHash "$STAKING_TX_HASH" \
            --arg ser9TxHash "$SER9_TX_HASH" \
            --arg managedTxHash "$MANAGED_TX_HASH" \
            --arg identityTxHash "$IDENTITY_TX_HASH" \
            --arg deployStaking "$DEPLOY_STAKING" \
            --arg deploySer9 "$DEPLOY_SER9" \
            --arg deployManaged "$DEPLOY_MANAGED" \
            --arg deployIdentity "$DEPLOY_IDENTITY" \
            --arg safeJson "$SAFE_JSON_OUT" \
            --arg skipVerify "$SKIP_VERIFY" \
            --arg verificationStatus "$VERIFICATION_STATUS" \
            --arg verificationFailures "$VERIFICATION_FAILURES" \
            --argjson txCount "$TX_COUNT" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              "staking": {
                "address": $stakingImpl,
                "txHash": $stakingTxHash,
                "deployed": ($deployStaking == "true")
              },
              "ser9": {
                "address": $ser9Impl,
                "txHash": $ser9TxHash,
                "deployed": ($deploySer9 == "true")
              },
              "managedToken": {
                "address": $managedImpl,
                "txHash": $managedTxHash,
                "deployed": ($deployManaged == "true")
              },
              "identity": {
                "address": $identityImpl,
                "txHash": $identityTxHash,
                "deployed": ($deployIdentity == "true")
              }
            } as $implementations
            | {
              "chainId": $chainId,
              "stakingProxy": $stakingProxy,
              "identityProxy": $identityProxy,
              "implementations": $implementations,
              "safeTxJson": $safeJson,
              "txCount": $txCount,
              "skipVerify": $skipVerify,
              "verificationStatus": $verificationStatus,
              "verificationFailures": $verificationFailures,
              "verifier": {
                "provider": "SocialScan",
                "url": "https://api.socialscan.io/monad/v1/explorer/command_api/contract"
              },
              "generatedAt": $generatedAt
            }' > "$RUN_FILE"

          echo "run_file=$RUN_FILE" >> "$GITHUB_OUTPUT"
          echo "safe_json=$SAFE_JSON_OUT" >> "$GITHUB_OUTPUT"
          echo "staking_impl=$STAKING_IMPL" >> "$GITHUB_OUTPUT"
          echo "ser9_impl=$SER9_IMPL" >> "$GITHUB_OUTPUT"
          echo "managed_impl=$MANAGED_IMPL" >> "$GITHUB_OUTPUT"
          echo "identity_impl=$IDENTITY_IMPL" >> "$GITHUB_OUTPUT"
          echo "tx_count=$TX_COUNT" >> "$GITHUB_OUTPUT"
          echo "verification_status=$VERIFICATION_STATUS" >> "$GITHUB_OUTPUT"
          echo "verification_failures=$VERIFICATION_FAILURES" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monad-release-${{ steps.abi.outputs.ref_slug }}
          if-no-files-found: error
          path: |
            ${{ steps.deploy.outputs.safe_json }}
            ${{ steps.deploy.outputs.run_file }}
            ${{ steps.abi.outputs.abi_dir }}

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.deploy.outputs.safe_json }}
            ${{ steps.deploy.outputs.run_file }}
            ${{ steps.abi.outputs.abi_dir }}/*.json

      - name: Write job summary
        run: |
          {
            echo "## Monad Mainnet release deployment"
            echo ""
            echo "- Release: \`${{ github.ref_name }}\`"
            echo "- Staking Proxy: \`${STAKING_PROXY}\`"
            if [[ "${{ steps.detect.outputs.deploy_staking }}" == "true" ]]; then
              echo "- New Staking implementation: \`${{ steps.deploy.outputs.staking_impl }}\`"
            else
              echo "- Staking implementation unchanged (current: \`${{ steps.detect.outputs.staking_current_impl }}\`)"
            fi
            if [[ "${{ steps.detect.outputs.deploy_ser9 }}" == "true" ]]; then
              echo "- New SER9 implementation: \`${{ steps.deploy.outputs.ser9_impl }}\`"
            else
              echo "- SER9 implementation unchanged (current: \`${{ steps.detect.outputs.ser9_current_impl }}\`)"
            fi
            if [[ "${{ steps.detect.outputs.deploy_managed }}" == "true" ]]; then
              echo "- New ManagedToken implementation: \`${{ steps.deploy.outputs.managed_impl }}\`"
            else
              echo "- ManagedToken implementation unchanged (current: \`${{ steps.detect.outputs.managed_current_impl }}\`)"
            fi
            if [[ -n "${IDENTITY_PROXY:-}" ]]; then
              echo "- Identity Proxy: \`${IDENTITY_PROXY}\`"
              if [[ "${{ steps.detect.outputs.deploy_identity }}" == "true" ]]; then
                echo "- New Identity implementation: \`${{ steps.deploy.outputs.identity_impl }}\`"
              else
                echo "- Identity implementation unchanged (current: \`${{ steps.detect.outputs.identity_current_impl }}\`)"
              fi
            fi
            echo "- Safe transactions queued: \`${{ steps.deploy.outputs.tx_count }}\`"
            echo "- Verification provider: \`SocialScan (Blockscout)\`"
            echo "- Verification URL: \`https://api.socialscan.io/monad/v1/explorer/command_api/contract\`"
            echo "- Verification status: \`${{ steps.deploy.outputs.verification_status }}\`"
            if [[ -n "${{ steps.deploy.outputs.verification_failures }}" ]]; then
              echo "- Verification failures: \`${{ steps.deploy.outputs.verification_failures }}\`"
            fi
            echo "- Safe Transaction Builder JSON: \`${{ steps.deploy.outputs.safe_json }}\`"
            echo "- ABI JSON directory: \`${{ steps.abi.outputs.abi_dir }}\`"
            echo "- Safe import URL: https://app.safe.global/transactions/tx-builder"
          } >> "$GITHUB_STEP_SUMMARY"
