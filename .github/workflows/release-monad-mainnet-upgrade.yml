name: Release Monad Mainnet Upgrade

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monad-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-and-generate-safe-tx:
    name: Deploy Upgrade + Safe Tx JSON
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      STAKING_PROXY: ${{ secrets.STAKING_PROXY }}
      STAKING_UPGRADE_DATA: ${{ secrets.STAKING_UPGRADE_DATA }}
      SER9_UPGRADE_DATA: ${{ secrets.SER9_UPGRADE_DATA }}
      MANAGED_UPGRADE_DATA: ${{ secrets.MANAGED_UPGRADE_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${MONAD_RPC_URL:?GitHub secret MONAD_RPC_URL is required}"
          : "${PRIVATE_KEY:?GitHub secret PRIVATE_KEY is required}"
          : "${STAKING_PROXY:?GitHub secret STAKING_PROXY is required}"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Show Foundry version
        run: forge --version

      - name: Build contracts
        env:
          FOUNDRY_PROFILE: deploy
        run: forge build

      - name: Deploy implementations and generate Safe Transaction Builder JSON
        id: deploy
        env:
          FOUNDRY_PROFILE: deploy
          SKIP_VERIFY_INPUT: ${{ vars.SKIP_VERIFY }}
        run: |
          set -euo pipefail

          # Default to skipping verification on CI to avoid "Chain 143 not supported".
          # Set repository variable SKIP_VERIFY=false only when you explicitly want verification.
          if [[ -n "${SKIP_VERIFY_INPUT:-}" ]]; then
            case "${SKIP_VERIFY_INPUT,,}" in
              true|false)
                export SKIP_VERIFY="${SKIP_VERIFY_INPUT,,}"
                ;;
              *)
                echo "Invalid SKIP_VERIFY value: ${SKIP_VERIFY_INPUT}. Use true or false." >&2
                exit 1
                ;;
            esac
          else
            export SKIP_VERIFY="true"
          fi

          SER9_DATA="${SER9_UPGRADE_DATA:-}"
          MANAGED_DATA="${MANAGED_UPGRADE_DATA:-}"
          STAKING_DATA="${STAKING_UPGRADE_DATA:-}"
          if [[ -z "$SER9_DATA" ]]; then SER9_DATA="0x"; fi
          if [[ -z "$MANAGED_DATA" ]]; then MANAGED_DATA="0x"; fi
          if [[ -z "$STAKING_DATA" ]]; then STAKING_DATA="0x"; fi

          echo "Deploying Staking implementation..."
          STAKING_DEPLOY_JSON="$(forge create src/Series9Staking.sol:Series9Staking \
            --rpc-url "$MONAD_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --json)"
          STAKING_IMPL="$(echo "$STAKING_DEPLOY_JSON" | jq -r '.deployedTo')"
          STAKING_TX_HASH="$(echo "$STAKING_DEPLOY_JSON" | jq -r '.transactionHash')"

          echo "Deploying SER9 implementation..."
          SER9_DEPLOY_JSON="$(forge create src/SER9Token.sol:SER9Token \
            --rpc-url "$MONAD_RPC_URL" \
            --private-key "$PRIVATE_KEY" \
            --broadcast \
            --json)"
          SER9_IMPL="$(echo "$SER9_DEPLOY_JSON" | jq -r '.deployedTo')"
          SER9_TX_HASH="$(echo "$SER9_DEPLOY_JSON" | jq -r '.transactionHash')"

          echo "Deploying ManagedToken implementation..."
          MANAGED_DEPLOY_JSON="$(forge create src/Series9ManagedToken.sol:Series9ManagedToken \
            --rpc-url "$MONAD_RPC_URL" \
            --broadcast \
            --private-key "$PRIVATE_KEY" \
            --json)"
          MANAGED_IMPL="$(echo "$MANAGED_DEPLOY_JSON" | jq -r '.deployedTo')"
          MANAGED_TX_HASH="$(echo "$MANAGED_DEPLOY_JSON" | jq -r '.transactionHash')"

          if [[ -z "$SER9_IMPL" || "$SER9_IMPL" == "null" ]]; then
            echo "Failed to parse deployed SER9 implementation address" >&2
            exit 1
          fi
          if [[ -z "$STAKING_IMPL" || "$STAKING_IMPL" == "null" ]]; then
            echo "Failed to parse deployed staking implementation address" >&2
            exit 1
          fi
          if [[ -z "$MANAGED_IMPL" || "$MANAGED_IMPL" == "null" ]]; then
            echo "Failed to parse deployed managed implementation address" >&2
            exit 1
          fi

          if [[ "$SKIP_VERIFY" == "false" ]]; then
            echo "Verification enabled (best effort)."
            set +e
            forge verify-contract "$STAKING_IMPL" src/Series9Staking.sol:Series9Staking \
              --chain 143 \
              --verifier blockscout \
              --verifier-url https://api.socialscan.io/monad/v1/explorer/command_api/contract
            forge verify-contract "$SER9_IMPL" src/SER9Token.sol:SER9Token \
              --chain 143 \
              --verifier blockscout \
              --verifier-url https://api.socialscan.io/monad/v1/explorer/command_api/contract
            forge verify-contract "$MANAGED_IMPL" src/Series9ManagedToken.sol:Series9ManagedToken \
              --chain 143 \
              --verifier blockscout \
              --verifier-url https://api.socialscan.io/monad/v1/explorer/command_api/contract
            set -e
          else
            echo "Skipping verification (SKIP_VERIFY=true)."
          fi

          STAKING_UPGRADE_CALLDATA="$(cast calldata \
            "upgradeToAndCall(address,bytes)" \
            "$STAKING_IMPL" \
            "$STAKING_DATA")"

          UPGRADE_TOKENS_CALLDATA="$(cast calldata \
            "upgradeTokens(address,address,bytes,bytes)" \
            "$SER9_IMPL" \
            "$MANAGED_IMPL" \
            "$SER9_DATA" \
            "$MANAGED_DATA")"

          SAFE_JSON_OUT="safe-tx-upgrade-all-${GITHUB_REF_NAME}.json"
          jq -n \
            --arg chainId "143" \
            --arg to "$STAKING_PROXY" \
            --arg stakingData "$STAKING_UPGRADE_CALLDATA" \
            --arg tokensData "$UPGRADE_TOKENS_CALLDATA" \
            '{
              version: "1.0",
              chainId: $chainId,
              meta: {
                name: "Series9 Upgrade All",
                description: "Upgrade Staking, SER9 and managed token implementations"
              },
              transactions: [
                {
                  to: $to,
                  value: "0",
                  data: $stakingData
                },
                {
                  to: $to,
                  value: "0",
                  data: $tokensData
                }
              ]
            }' > "$SAFE_JSON_OUT"

          RUN_FILE="release-deploy-${GITHUB_REF_NAME}.json"
          jq -n \
            --arg chainId "143" \
            --arg stakingProxy "$STAKING_PROXY" \
            --arg stakingImpl "$STAKING_IMPL" \
            --arg ser9Impl "$SER9_IMPL" \
            --arg managedImpl "$MANAGED_IMPL" \
            --arg stakingTxHash "$STAKING_TX_HASH" \
            --arg ser9TxHash "$SER9_TX_HASH" \
            --arg managedTxHash "$MANAGED_TX_HASH" \
            --arg safeJson "$SAFE_JSON_OUT" \
            --arg skipVerify "$SKIP_VERIFY" \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{
              chainId: $chainId,
              stakingProxy: $stakingProxy,
              implementations: {
                staking: {
                  address: $stakingImpl,
                  txHash: $stakingTxHash
                },
                ser9: {
                  address: $ser9Impl,
                  txHash: $ser9TxHash
                },
                managedToken: {
                  address: $managedImpl,
                  txHash: $managedTxHash
                }
              },
              safeTxJson: $safeJson,
              skipVerify: $skipVerify,
              generatedAt: $generatedAt
            }' > "$RUN_FILE"

          echo "run_file=$RUN_FILE" >> "$GITHUB_OUTPUT"
          echo "safe_json=$SAFE_JSON_OUT" >> "$GITHUB_OUTPUT"
          echo "staking_impl=$STAKING_IMPL" >> "$GITHUB_OUTPUT"
          echo "ser9_impl=$SER9_IMPL" >> "$GITHUB_OUTPUT"
          echo "managed_impl=$MANAGED_IMPL" >> "$GITHUB_OUTPUT"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: monad-release-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            ${{ steps.deploy.outputs.safe_json }}
            ${{ steps.deploy.outputs.run_file }}

      - name: Attach artifacts to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.deploy.outputs.safe_json }}
            ${{ steps.deploy.outputs.run_file }}

      - name: Write job summary
        run: |
          {
            echo "## Monad Mainnet release deployment"
            echo ""
            echo "- Release: \`${{ github.ref_name }}\`"
            echo "- Staking Proxy: \`${STAKING_PROXY}\`"
            echo "- New Staking implementation: \`${{ steps.deploy.outputs.staking_impl }}\`"
            echo "- New SER9 implementation: \`${{ steps.deploy.outputs.ser9_impl }}\`"
            echo "- New ManagedToken implementation: \`${{ steps.deploy.outputs.managed_impl }}\`"
            echo "- Safe Transaction Builder JSON: \`${{ steps.deploy.outputs.safe_json }}\`"
            echo "- Safe import URL: https://app.safe.global/transactions/tx-builder"
          } >> "$GITHUB_STEP_SUMMARY"
