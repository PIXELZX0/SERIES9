name: Token Metadata Safe Tx

on:
  workflow_dispatch:
    inputs:
      description:
        description: ERC-20M description string to store on SER9
        required: true
        default: SERIES9 staking token

permissions:
  contents: read

jobs:
  generate:
    name: Generate setTokenMetadata Safe Tx JSON
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONAD_RPC_URL: ${{ secrets.MONAD_RPC_URL }}
      STAKING_PROXY: ${{ secrets.STAKING_PROXY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          : "${MONAD_RPC_URL:?GitHub secret MONAD_RPC_URL is required}"
          : "${STAKING_PROXY:?GitHub secret STAKING_PROXY is required}"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Verify the batch simulates against live state
        run: forge test --match-path test/Ser9MetadataFork.t.sol -vv

      - name: Generate Safe Transaction Builder JSON
        env:
          METADATA_DESCRIPTION: ${{ inputs.description }}
        run: |
          set -euo pipefail
          # The script reads the SER9 proxy and its current implementation off chain,
          # so it needs an RPC and takes no address input.
          forge script script/SafeBatch.s.sol:SafeSetTokenMetadata \
            --sig "run(string)" "$METADATA_DESCRIPTION" \
            --rpc-url "$MONAD_RPC_URL"

      - name: Upload Safe tx JSON
        uses: actions/upload-artifact@v4
        with:
          name: safe-tx-set-token-metadata
          if-no-files-found: error
          path: safe-tx-set-token-metadata.json

      - name: Write job summary
        run: |
          {
            echo "## SER9 token metadata Safe transaction"
            echo ""
            echo "- Staking proxy (batch target): \`${STAKING_PROXY}\`"
            echo "- Route: \`upgradeSer9(currentImpl, setTokenMetadata(...))\` — SER9 is owned by Staking, not the Safe"
            echo "- Description: \`${{ inputs.description }}\`"
            echo "- Image: inlined base64 data: URI from \`assets/series9-logo.svg\`"
            echo "- Artifact: \`safe-tx-set-token-metadata\`"
            echo "- Safe import URL: https://app.safe.global/transactions/tx-builder"
          } >> "$GITHUB_STEP_SUMMARY"
