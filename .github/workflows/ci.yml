name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build + Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check formatting
        run: forge fmt --check
        continue-on-error: true

      - name: Build
        run: forge build

      - name: Test
        run: forge test -vvv
